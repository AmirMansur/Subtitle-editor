                        ? Column(mainAxisSize: MainAxisSize.min, children: [branchBar(ctx), const Padding(padding: EdgeInsets.all(24), child: Text('No commits yet. Tap the check icon to save a snapshot.'))])
                        : ListView(shrinkWrap: true, children: [
                            branchBar(ctx),
                            for (final c in commits.reversed)
                              ListTile(
                                title: Text(c['m'] as String),
                                subtitle: Text(DateTime.fromMillisecondsSinceEpoch(c['t'] as int).toString().substring(0, 16)),
                                trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                                  TextButton(onPressed: () => showDiff(c), child: const Text('Diff')),
                                  TextButton(
