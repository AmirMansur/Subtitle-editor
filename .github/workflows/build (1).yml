            Future<void> aiReview() async {
              if (doc.subs.isEmpty) return;
              final from = ok ? sel : 0, end = min(doc.subs.length, from + 25);
              final lines = [for (var i = from; i < end; i++) {'i': i, 'speaker': doc.subs[i].meta.length == 7 ? doc.subs[i].meta[2] : '', 'text': stripTags(doc.subs[i].text)}];
              final prompt = 'You are a subtitle proofreader for Hindi, Hinglish and English. Check these subtitle lines for grammar, spelling, punctuation and Hindi/Hinglish gender agreement (use the character list). Keep meaning, language and script. Reply ONLY with a JSON array of objects with keys i (index), fix (corrected line) and why (short reason) for lines that need a change, or [] if none.\nCharacters: ${jsonEncode(chars)}\nLines: ${jsonEncode(lines)}';
              try {
                final txt = await aiCall(prompt);
                final arr = jsonDecode(txt.substring(txt.indexOf('['), txt.lastIndexOf(']') + 1)) as List;
                var n = 0;
                for (final e in arr) {
                  final i = e['i'] as int;
                  if (i < 0 || i >= doc.subs.length) continue;
                  final u = doc.subs[i];
                  final tagged = u.text.contains('{');
                  queue.add({'id': u.id, 'old': u.text, 'neu': tagged ? null : e['fix'], 'why': tagged ? 'AI: ${e['why']} -> ${e['fix']}' : 'AI: ${e['why']}'});
                  n++;
                }
                if (mounted) snack('AI found $n suggestions');
              } catch (e) {
                if (mounted) snack('$e');
              }
            }

