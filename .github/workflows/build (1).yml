            }

            Widget controls() {
              Widget ib(IconData i, VoidCallback f, {Color? c, String? tip}) => IconButton(onPressed: f, icon: Icon(i, color: c), tooltip: tip, visualDensity: VisualDensity.compact);
              return SingleChildScrollView(
                scrollDirection: Axis.horizontal,
                child: Row(children: [
                  ib(Icons.replay_5, () => seekMs(pos.inMilliseconds - 5000), tip: 'Back 5s'),
                  ib(Icons.chevron_left, () => seekMs(pos.inMilliseconds - 42), tip: 'Frame back'),
                  ib(playing ? Icons.pause_circle_filled : Icons.play_circle_fill, () => player.playOrPause(), c: kBlue),
                  ib(Icons.chevron_right, () => seekMs(pos.inMilliseconds + 42), tip: 'Frame forward'),
                  ib(Icons.forward_5, () => seekMs(pos.inMilliseconds + 5000), tip: 'Forward 5s'),
                  ib(Icons.repeat_one, () => setState(() => loop = !loop), c: loop ? kPurple : Colors.white54, tip: 'Loop selected line'),
                  ib(Icons.bolt, () => setState(() => autoPlay = !autoPlay), c: autoPlay ? kBlue : Colors.white54, tip: 'Auto-play on select'),
                  ib(Icons.translate, () {
                    setState(() => ovMode = (ovMode + 1) % 3);
                    snack(['Video shows: your edited text', 'Video shows: original text', 'Video shows: original + edited'][ovMode]);
                  }, c: kBlue, tip: 'Video text mode'),
                  PopupMenuButton<int>(
                    tooltip: 'Timeline zoom',
                    onSelected: (v) => setState(() => win = v),
                    itemBuilder: (_) => [for (final z in [4, 8, 15, 30, 60]) PopupMenuItem(value: z * 1000, child: Text('Zoom ${z}s'))],
                    child: Padding(padding: const EdgeInsets.symmetric(horizontal: 10), child: Text('Zoom ${win ~/ 1000}s', style: const TextStyle(color: kBlue))),
                  ),
                  PopupMenuButton<double>(
                    tooltip: 'Speed',
                    onSelected: (v) {
                      rate = v;
                      player.setRate(v);
                      setState(() {});
                    },
                    itemBuilder: (_) => [for (final r in [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]) PopupMenuItem(value: r, child: Text('${r}x'))],
                    child: Padding(padding: const EdgeInsets.symmetric(horizontal: 10), child: Text('${rate}x', style: const TextStyle(color: kBlue))),
                  ),
                  PopupMenuButton<int>(
                    tooltip: 'Pre-roll',
                    onSelected: (v) {
                      preRoll = v;
                      setState(() {});
                      autosave();
                    },
                    itemBuilder: (_) => [for (final s in [0, 1, 2, 3, 5]) PopupMenuItem(value: s * 1000, child: Text('Pre-roll ${s}s'))],
                    child: Padding(padding: const EdgeInsets.symmetric(horizontal: 10), child: Text('Pre ${preRoll ~/ 1000}s', style: const TextStyle(color: kPurple))),
                  ),
                ]),
              );
            }

            Widget ab(IconData i, VoidCallback? f, String t) => IconButton(onPressed: f, icon: Icon(i, size: 20), tooltip: t, visualDensity: VisualDensity.compact);

            Widget timeRow(String label, Sub s, bool st) {
              final v = st ? s.start : s.end;
              Widget b(String t, int d) => InkWell(
                    onTap: () => nudge(st, d),
                    child: Padding(padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 6), child: Text(t, style: const TextStyle(color: kBlue, fontSize: 12))),
                  );
              return Row(children: [
                SizedBox(width: 128, child: Text('$label ${srtT(v)}', style: const TextStyle(fontSize: 12))),
                b('-.5', -500),
                b('-.1', -100),
                b('+.1', 100),
                b('+.5', 500),
                const Spacer(),
                TextButton(onPressed: () => setNow(st), style: TextButton.styleFrom(visualDensity: VisualDensity.compact), child: const Text('= now')),
              ]);
            }

            Widget panel() {
              if (!ok) {
                return Padding(
                  padding: const EdgeInsets.all(8),
                  child: Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                    const Text('Tap a subtitle to edit', style: TextStyle(color: Colors.white54)),
                    ab(Icons.add_circle, addNow, 'Add at current time'),
                    ab(Icons.undo, undo.isEmpty ? null : undoIt, 'Undo'),
                    ab(Icons.redo, redo.isEmpty ? null : redoIt, 'Redo'),
                  ]),
                );
              }
              final s = doc.subs[sel];
              final o = stripTags(s.orig).replaceAll('\n', ' ');
              final cw = MediaQuery.of(context).size.width - 90;
              return Container(
                margin: const EdgeInsets.fromLTRB(10, 2, 10, 4),
                padding: const EdgeInsets.fromLTRB(12, 6, 12, 2),
                decoration: BoxDecoration(color: Colors.white.withOpacity(.06), borderRadius: BorderRadius.circular(16), border: Border.all(color: kPurple.withOpacity(.5))),
                child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Row(children: [
                    Text('Line ${sel + 1} of ${doc.subs.length}', style: const TextStyle(fontSize: 12, color: kBlue)),
                    const Spacer(),
                    TextButton.icon(onPressed: suggBusy ? null : suggestLine, icon: const Icon(Icons.auto_awesome, size: 16), label: const Text('Suggest'), style: TextButton.styleFrom(visualDensity: VisualDensity.compact)),
                  ]),
                  if (o.isNotEmpty)
                    Container(
                      width: double.infinity,
                      margin: const EdgeInsets.only(bottom: 6),
                      padding: const EdgeInsets.fromLTRB(10, 6, 4, 6),
                      decoration: BoxDecoration(color: Colors.amber.withOpacity(.10), borderRadius: BorderRadius.circular(10)),
                      child: Row(children: [
                        Expanded(
                          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            const Text('ORIGINAL', style: TextStyle(fontSize: 10, color: Colors.amberAccent, letterSpacing: 1)),
                            Text(o, style: const TextStyle(fontSize: 14, color: Colors.white70)),
                          ]),
                        ),
                        if (s.orig != s.text)
                          TextButton(
                            onPressed: () {
                              mutate(() => s.text = s.orig);
                              tc.text = s.text;
                            },
                            child: const Text('Revert'),
                          ),
                      ]),
                    ),
                  TextField(
                    controller: tc,
                    focusNode: tf,
                    minLines: 2,
                    maxLines: 4,
                    style: const TextStyle(fontSize: 16),
                    onChanged: (v) {
                      if (needSnap) {
                        pushUndo();
                        needSnap = false;
                      }
                      s.text = v;
                      setState(() {});
                      autosave();
                    },
                    decoration: InputDecoration(filled: true, fillColor: Colors.black26, isDense: true, border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none), hintText: 'Type your version here'),
                  ),
                  if (suggBusy) const Padding(padding: EdgeInsets.only(top: 6), child: LinearProgressIndicator(minHeight: 2)),
                  if (sugg.isNotEmpty)
                    Padding(
                      padding: const EdgeInsets.only(top: 6),
                      child: Wrap(spacing: 6, runSpacing: 4, children: [
                        for (final t in sugg) ActionChip(label: SizedBox(width: cw, child: Text(t, maxLines: 3, overflow: TextOverflow.ellipsis)), onPressed: () => applySugg(t)),
                      ]),
                    ),
                  timeRow('Start', s, true),
                  timeRow('End', s, false),
                  if (ref != null && refFor(s).isNotEmpty)
                    Row(children: [
                      Expanded(child: Text(refFor(s), maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.amberAccent, fontSize: 12))),
                      TextButton(
                        onPressed: () {
                          mutate(() => s.text = refFor(s));
                          tc.text = s.text;
                        },
                        child: const Text('use'),
                      ),
                    ]),
                  Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [
                    ab(Icons.call_split, split, 'Split at cursor'),
                    ab(Icons.call_merge, mergeNext, 'Merge with next'),
                    ab(Icons.copy, dup, 'Duplicate'),
                    ab(Icons.add_circle, addNow, 'Add at current time'),
                    ab(Icons.delete, del, 'Delete'),
                    ab(Icons.undo, undo.isEmpty ? null : undoIt, 'Undo'),
                    ab(Icons.redo, redo.isEmpty ? null : redoIt, 'Redo'),
                  ]),
                ]),
              );
            }

            Widget tile(int i) {
              final s = doc.subs[i];
              final isSel = i == sel, isAct = i == active;
              final t = stripTags(s.text).replaceAll('\n', ' ');
              final d = (s.end - s.start) / 1000;
              final cps = d > 0 ? t.length / d : 99.0;
              final warn = (i + 1 < doc.subs.length && s.end > doc.subs[i + 1].start) || t.trim().isEmpty || d < 0.5 || cps > 20;
              final ch = change(s);
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                child: InkWell(
                  borderRadius: BorderRadius.circular(14),
                  onTap: () => select(i),
                  onLongPress: () => setState(() { s.rv = (s.rv + 1) % 3; autosave(); }),
                  child: AnimatedContainer(
                    duration: const Duration(milliseconds: 200),
                    padding: const EdgeInsets.symmetric(horizontal: 10),
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(14),
                      gradient: isAct ? LinearGradient(colors: [kPurple.withOpacity(.45), kBlue.withOpacity(.25)]) : null,
                      color: isAct ? null : kCard,
                      border: Border.all(color: isSel ? kBlue : Colors.white10, width: isSel ? 1.6 : 1),
                    ),
                    child: Row(children: [
                      SizedBox(
                        width: 34,
                        child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                          Text('${i + 1}', style: const TextStyle(fontSize: 12, color: Colors.white54)),
                          if (ch != null) Icon(Icons.circle, size: 8, color: ch),
                        ]),
                      ),
                      Expanded(
                        child: Column(mainAxisAlignment: MainAxisAlignment.center, crossAxisAlignment: CrossAxisAlignment.start, children: [
                          Text('${srtT(s.start)} -> ${srtT(s.end)} | ${cps.toStringAsFixed(1)} cps', style: const TextStyle(fontSize: 11, color: kBlue)),
                          Text(t, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 15)),
                          if (s.orig.isNotEmpty && s.orig != s.text) Text(stripTags(s.orig).replaceAll('\n', ' '), maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 11, color: Colors.white38)),
                          if (ref != null && refFor(s).isNotEmpty) Text(refFor(s), maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12, color: Colors.amberAccent)),
                        ]),
                      ),
                      if (warn) const Icon(Icons.warning_amber_rounded, color: Colors.amber, size: 20),
                      if (s.rv == 1) const Icon(Icons.check_circle, color: Colors.greenAccent, size: 18),
                      if (s.rv == 2) const Icon(Icons.flag, color: Colors.redAccent, size: 18),
                    ]),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final kb = MediaQuery.of(context).viewInsets.bottom > 0;
              final w = MediaQuery.of(context).size.width;
              active = activeAt(pos.inMilliseconds);
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Subtitle Studio', style: TextStyle(fontWeight: FontWeight.w800, fontSize: 18)),
                  backgroundColor: Colors.transparent,
                  flexibleSpace: Container(decoration: BoxDecoration(gradient: LinearGradient(colors: [kPurple.withOpacity(.55), kBlue.withOpacity(.25)]))),
                  actions: [
                    IconButton(onPressed: queueSheet, icon: const Icon(Icons.auto_fix_high), tooltip: 'Correction queue'),
                    IconButton(onPressed: commit, icon: const Icon(Icons.check_circle_outline), tooltip: 'Commit'),
                    IconButton(onPressed: history, icon: const Icon(Icons.history), tooltip: 'History'),
                    menu(),
                  ],
                ),
                body: Column(children: [
                  SizedBox(height: kb ? 90 : w * 9 / 16, child: videoBox()),
                  if (!kb) ...[seekBar(), controls(), timeline(), panel()],
                  if (kb)
                    Expanded(child: SingleChildScrollView(child: panel()))
                  else
                    Expanded(
                      child: doc.subs.isEmpty
                          ? Center(child: FilledButton.icon(onPressed: openSub, icon: const Icon(Icons.subtitles), label: const Text('Open subtitle (.srt .ass .vtt .txt)')))
                          : ListView.builder(controller: scroll, itemExtent: ext, itemCount: doc.subs.length, itemBuilder: (_, i) => tile(i)),
                    ),
                ]),
              );
            }
          }
          EOF

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleStudio-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
