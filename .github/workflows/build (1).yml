            // ----- branches -----
            void newBranch(String name) {
              if (name.isEmpty || name == branch || others.containsKey(name)) return;
              others[name] = {'commits': commits.map((e) => Map<String, dynamic>.from(e)).toList(), 'work': snap(), 'next': doc.nextId + 100000 * (others.length + 1)};
              switchBranch(name);
              snack('Branch "$name" created');
            }

            void switchBranch(String name) {
              final t = others.remove(name);
              if (t == null || name == branch) return;
              others[branch] = {'commits': commits, 'work': snap(), 'next': doc.nextId};
              branch = name;
              commits = (t['commits'] as List).map((e) => Map<String, dynamic>.from(e as Map)).toList();
              doc.subs = subsFrom(t['work'] as String);
              doc.nextId = t['next'] as int;
              undo.clear();
              redo.clear();
              rebase();
              sel = -1;
              tc.text = '';
              setState(() {});
              autosave();
              reloadSub();
            }

            void mergeFrom(String name) {
              final t = others[name];
              if (t == null) return;
              final other = subsFrom(t['work'] as String);
              checkpoint('Auto checkpoint before merging $name');
              mutate(() {
                final cm = {for (final x in doc.subs) x.id: x};
                for (final o in other) {
                  final c = cm[o.id];
                  if (c == null) {
                    doc.subs.add(o.copy());
                  } else if (c.text != o.text || c.start != o.start || c.end != o.end) {
                    c.text = o.text;
                    c.start = o.start;
                    c.end = o.end;
                  }
                }
                doc.subs.sort((a, b) => a.start.compareTo(b.start));
                doc.nextId = max(doc.nextId, other.fold<int>(0, (a, x) => max(a, x.id)) + 1);
              });
              fix();
              snack('Merged added and changed lines from $name');
            }

