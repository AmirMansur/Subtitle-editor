            double get ext => ref == null ? 96.0 : 112.0;

            void reloadSub() {}

            Future<void> loadWave() async {
              if (videoPath == null) return;
              setState(() => waveBusy = true);
              try {
                final hk = videoPath!.codeUnits.fold<int>(7, (a, b) => (a * 31 + b) & 0x7fffffff);
                final cf = await pf('wave_$hk.txt');
                if (await cf.exists()) {
                  wave = (await cf.readAsString()).split(',').where((e) => e.isNotEmpty).map(int.parse).toList();
                } else {
                  final r = await wch.invokeMethod<List<dynamic>>('peaks', {'path': videoPath, 'bucketMs': 50});
                  wave = (r ?? []).map((e) => e as int).toList();
                  await cf.writeAsString(wave.join(','));
                }
                wavePeak = max(1, wave.fold<int>(0, (a, b) => max(a, b)));
              } catch (_) {
                wave = [];
              }
              if (mounted) setState(() => waveBusy = false);
            }

            // ----- timeline (waveform + drag to retime) -----
            int xToMs(double x) => pos.inMilliseconds - win ~/ 2 + (x / tlW * win).round();

            int tlHit(double x, double y, int tol) {
              if (y < 50) return -1;
              final t = xToMs(x);
              if (ok && t >= doc.subs[sel].start - tol && t <= doc.subs[sel].end + tol) return sel;
              for (var i = 0; i < doc.subs.length; i++) {
                if (t >= doc.subs[i].start - tol && t <= doc.subs[i].end + tol) return i;
              }
              return -1;
            }

            void tlTap(Offset p) {
              final i = tlHit(p.dx, p.dy, (10 / tlW * win).round());
              if (i >= 0) {
                sel = i;
                tc.text = doc.subs[i].text;
                setState(() {});
              } else {
                seekMs(xToMs(p.dx));
              }
            }

            void tlStart(Offset p) {
              final tol = (22 / tlW * win).round();
              final i = tlHit(p.dx, p.dy, tol);
              if (i < 0) {
                dragMode = 0;
                return;
              }
              sel = i;
              tc.text = doc.subs[i].text;
              final t = xToMs(p.dx), u = doc.subs[i];
              final ds = (t - u.start).abs(), de = (t - u.end).abs();
              dragMode = ds < tol && ds <= de ? 2 : (de < tol ? 3 : 1);
              pushUndo();
            }

            void tlMove(double dx) {
              final dms = (dx / tlW * win).round();
              if (dragMode == 0) {
                seekMs(pos.inMilliseconds - dms);
                return;
              }
              if (!ok) return;
              final u = doc.subs[sel];
              if (dragMode == 1) {
                final len = u.end - u.start;
                u.start = max(0, u.start + dms);
                u.end = u.start + len;
              } else if (dragMode == 2) {
                u.start = min(u.end - 100, max(0, u.start + dms));
              } else {
                u.end = max(u.start + 100, u.end + dms);
              }
              setState(() {});
            }

            void tlEnd() {
              if (dragMode != 0) {
                autosave();
                reloadSub();
              }
              dragMode = 0;
            }

            Widget timeline() => Container(
                  height: 84,
                  margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 2),
                  decoration: BoxDecoration(color: kCard, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                  child: ClipRRect(
                    borderRadius: BorderRadius.circular(12),
                    child: LayoutBuilder(builder: (ctx, k) {
                      tlW = k.maxWidth;
                      return GestureDetector(
                        onTapUp: (d) => tlTap(d.localPosition),
                        onHorizontalDragStart: (d) => tlStart(d.localPosition),
                        onHorizontalDragUpdate: (d) => tlMove(d.delta.dx),
                        onHorizontalDragEnd: (_) => tlEnd(),
                        child: Stack(children: [
                          CustomPaint(size: Size(k.maxWidth, 84), painter: TlPainter(wave, wavePeak, doc.subs, ref?.subs, pos.inMilliseconds, win, sel)),
                          if (waveBusy) const Positioned(left: 8, top: 6, child: Text('Reading audio...', style: TextStyle(fontSize: 10, color: Colors.white54))),
                        ]),
                      );
                    }),
                  ),
                );

            // ----- compare track -----
            String refFor(Sub s) {
              if (ref == null) return '';
              final m = (s.start + s.end) ~/ 2;
              for (final x in ref!.subs) {
                if (x.start <= m && m < x.end) return stripTags(x.text).replaceAll('\n', ' ');
              }
              return '';
            }

            String refNow() {
              if (ref == null) return '';
              final t = pos.inMilliseconds;
              for (final x in ref!.subs) {
                if (t >= x.start && t < x.end) return stripTags(x.text).replaceAll('\n', ' ');
              }
              return '';
            }

