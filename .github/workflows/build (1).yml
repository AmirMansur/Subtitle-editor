name: Build Subtitle Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter project and write app code
        run: |
          flutter create --org com.hero --project-name subtitle_studio --platforms android app
          cd app
          rm -rf test
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'GR'
          subprojects {
              if (name != "app") {
                  val fix = Action<Project> { extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) } }
                  if (state.executed) fix.execute(this) else afterEvaluate(fix)
              }
          }
          GR
          else
            cat >> android/build.gradle <<'GR'
          subprojects { afterEvaluate { p -> if (p.hasProperty('android')) { p.android { compileSdkVersion 36 } } } }
          GR
          fi
          mkdir -p assets/fonts android/app/src/main/kotlin/com/hero/subtitle_studio
          F=$(find /usr/share/fonts -iname 'DejaVuSans.ttf' | head -1)
          if [ -z "$F" ]; then F=$(find /usr/share/fonts -iname '*.ttf' | head -1); fi
          cp "$F" assets/fonts/sub.ttf
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/kotlin/com/hero/subtitle_studio/MainActivity.kt <<'KT'
          package com.hero.subtitle_studio

          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.nio.ByteOrder
          import kotlin.concurrent.thread
          import kotlin.math.abs
          import kotlin.math.max

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "wave").setMethodCallHandler { call, result ->
                      if (call.method == "peaks") {
                          val path = call.argument<String>("path") ?: ""
                          val bucket = call.argument<Int>("bucketMs") ?: 50
                          thread {
                              try {
                                  val r = peaks(path, bucket)
                                  runOnUiThread { result.success(r) }
                              } catch (e: Exception) {
                                  runOnUiThread { result.error("E", e.message, null) }
                              }
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun peaks(path: String, bucketMs: Int): List<Int> {
                  val ex = MediaExtractor()
                  ex.setDataSource(path)
                  var idx = -1
                  for (i in 0 until ex.trackCount) {
                      val m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                      if (m.startsWith("audio/")) { idx = i; break }
                  }
                  if (idx < 0) { ex.release(); return emptyList() }
                  ex.selectTrack(idx)
                  val fmt = ex.getTrackFormat(idx)
                  val codec = MediaCodec.createDecoderByType(fmt.getString(MediaFormat.KEY_MIME)!!)
                  codec.configure(fmt, null, null, 0)
                  codec.start()
                  val info = MediaCodec.BufferInfo()
                  val out = ArrayList<Int>()
                  var per = fmt.getInteger(MediaFormat.KEY_SAMPLE_RATE) * fmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT) * bucketMs / 1000
                  if (per < 1) per = 1
                  var cnt = 0
                  var mx = 0
                  var inDone = false
                  var outDone = false
                  while (!outDone) {
                      if (!inDone) {
                          val i = codec.dequeueInputBuffer(10000)
                          if (i >= 0) {
                              val buf = codec.getInputBuffer(i)!!
                              val n = ex.readSampleData(buf, 0)
                              if (n < 0) {
                                  codec.queueInputBuffer(i, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                  inDone = true
                              } else {
                                  codec.queueInputBuffer(i, 0, n, ex.sampleTime, 0)
                                  ex.advance()
                              }
                          }
                      }
                      val o = codec.dequeueOutputBuffer(info, 10000)
                      if (o >= 0) {
                          val b = codec.getOutputBuffer(o)!!
                          b.position(info.offset)
                          b.limit(info.offset + info.size)
                          val sb = b.order(ByteOrder.LITTLE_ENDIAN).asShortBuffer()
                          while (sb.hasRemaining()) {
                              mx = max(mx, abs(sb.get().toInt()))
                              cnt++
                              if (cnt >= per) { out.add(mx * 100 / 32768); cnt = 0; mx = 0 }
                          }
                          codec.releaseOutputBuffer(o, false)
                          if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) outDone = true
                      } else if (o == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          val f = codec.outputFormat
                          per = f.getInteger(MediaFormat.KEY_SAMPLE_RATE) * f.getInteger(MediaFormat.KEY_CHANNEL_COUNT) * bucketMs / 1000
                          if (per < 1) per = 1
                      }
                  }
                  codec.stop()
                  codec.release()
                  ex.release()
                  return out
              }
          }
          KT
          cat > pubspec.yaml <<'EOF'
          name: subtitle_studio
          description: Subtitle Studio
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            media_kit: ^1.1.11
            media_kit_video: ^1.2.5
            media_kit_libs_video: ^1.0.5
            file_picker: ^8.1.2
            path_provider: ^2.1.4
          flutter:
            uses-material-design: true
            assets:
              - assets/fonts/sub.ttf
          EOF
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'dart:typed_data';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';
          import 'package:path_provider/path_provider.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            MediaKit.ensureInitialized();
            runApp(const App());
          }

          const kPurple = Color(0xFF8B5CF6), kBlue = Color(0xFF38BDF8), kBg = Color(0xFF0F1117), kCard = Color(0xFF1A1D29);

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
                  debugShowCheckedModeBanner: false,
                  title: 'Subtitle Studio',
                  theme: ThemeData(
                    brightness: Brightness.dark,
                    useMaterial3: true,
                    scaffoldBackgroundColor: kBg,
                    colorScheme: const ColorScheme.dark(primary: kPurple, secondary: kBlue, surface: kCard),
                  ),
                  home: const Editor(),
                );
          }

          // ---------- model ----------
          class Sub {
            int id, start, end;
            String text;
            List<String> meta; // ASS: layer,style,name,mL,mR,mV,effect
            int rv = 0; // 0 none, 1 reviewed, 2 needs fix
            String orig = '';
            Sub(this.id, this.start, this.end, this.text, [List<String>? m]) : meta = m ?? [];
            Sub copy() => Sub(id, start, end, text, List.of(meta))..rv = rv..orig = orig;
            Map<String, dynamic> toJson() => {'i': id, 's': start, 'e': end, 't': text, 'm': meta, 'r': rv, 'o': orig};
            static Sub fromJson(Map j) => Sub(j['i'], j['s'], j['e'], j['t'], List<String>.from(j['m']))..rv = j['r'] ?? 0..orig = j['o'] ?? j['t'];
          }

          class Doc {
            String fmt = 'srt', header = '', footer = '';
            List<Sub> subs = [];
            int nextId = 1;
          }

          List<Sub> subsFrom(String s) => (jsonDecode(s) as List).map((e) => Sub.fromJson(e as Map)).toList();

          String two(int n) => n.toString().padLeft(2, '0');
          String srtT(int ms, [String sep = ',']) {
            if (ms < 0) ms = 0;
            return '${two(ms ~/ 3600000)}:${two(ms ~/ 60000 % 60)}:${two(ms ~/ 1000 % 60)}$sep${(ms % 1000).toString().padLeft(3, '0')}';
          }

          String assT(int ms) {
            if (ms < 0) ms = 0;
            return '${ms ~/ 3600000}:${two(ms ~/ 60000 % 60)}:${two(ms ~/ 1000 % 60)}.${two(ms % 1000 ~/ 10)}';
          }

          int parseT(String s) {
            final m = RegExp(r'(?:(\d+):)?(\d+):(\d+)[,.](\d+)').firstMatch(s.trim());
            if (m == null) return 0;
            final f = m.group(4)!;
            final ms = f.length == 1 ? int.parse(f) * 100 : f.length == 2 ? int.parse(f) * 10 : int.parse(f.substring(0, 3));
            return int.parse(m.group(1) ?? '0') * 3600000 + int.parse(m.group(2)!) * 60000 + int.parse(m.group(3)!) * 1000 + ms;
          }

          String stripTags(String t) => t
              .replaceAll(RegExp(r'\{[^}]*\}'), '')
              .replaceAll(RegExp(r'<[^>]+>'), '')
              .replaceAll(r'\N', '\n')
              .replaceAll(r'\n', '\n')
              .replaceAll(r'\h', ' ');

          Doc parseDoc(String raw, String ext) {
            final d = Doc();
            raw = raw.replaceAll('\r\n', '\n').replaceAll('\r', '\n');
            if (raw.startsWith('\uFEFF')) raw = raw.substring(1);
            if (ext == 'ass' || ext == 'ssa') {
              d.fmt = 'ass';
              final head = <String>[], foot = <String>[];
              var seen = false;
              for (final l in raw.split('\n')) {
                if (l.startsWith('Dialogue:')) {
                  var rest = l.substring(9).trimLeft();
                  final p = <String>[];
                  for (var i = 0; i < 9; i++) {
                    final k = rest.indexOf(',');
                    if (k < 0) break;
                    p.add(rest.substring(0, k));
                    rest = rest.substring(k + 1);
                  }
                  if (p.length < 9) {
                    foot.add(l);
                    continue;
                  }
                  seen = true;
                  d.subs.add(Sub(d.nextId++, parseT(p[1]), parseT(p[2]), rest, [p[0], p[3], p[4], p[5], p[6], p[7], p[8]]));
                } else {
                  (seen ? foot : head).add(l);
                }
              }
              d.header = head.join('\n');
              d.footer = foot.join('\n');
            } else if (ext == 'txt') {
              d.fmt = 'txt';
              var t = 0;
              for (final l in raw.split('\n')) {
                if (l.trim().isEmpty) continue;
                d.subs.add(Sub(d.nextId++, t, t + 2500, l.trim()));
                t += 2500;
              }
            } else {
              d.fmt = ext == 'vtt' ? 'vtt' : 'srt';
              for (final b in raw.split(RegExp(r'\n\s*\n'))) {
                final ls = b.split('\n');
                final i = ls.indexWhere((x) => x.contains('-->'));
                if (i < 0) continue;
                final tt = ls[i].split('-->');
                d.subs.add(Sub(d.nextId++, parseT(tt[0]), parseT(tt[1]), ls.sublist(i + 1).join('\n').trim()));
              }
            }
            for (final x in d.subs) {
              x.orig = x.text;
            }
            return d;
          }

          const kAssHead = '[Script Info]\nScriptType: v4.00+\nPlayResX: 1280\nPlayResY: 720\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: Default,Arial,48,&H00FFFFFF,&H000000FF,&H00000000,&H64000000,0,0,0,0,100,100,0,0,1,2,1,2,20,20,30,1\n\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text';

          String exportDoc(Doc d, String to) {
            final subs = List<Sub>.of(d.subs)..sort((a, b) => a.start.compareTo(b.start));
            final fromAss = d.fmt == 'ass';
            String plain(Sub x) => fromAss ? stripTags(x.text) : x.text;
            final b = StringBuffer();
            if (to == 'ass') {
              b.writeln(fromAss && d.header.isNotEmpty ? d.header : kAssHead);
              for (final x in subs) {
                final m = x.meta.length == 7 ? x.meta : ['0', 'Default', '', '0', '0', '0', ''];
                final t = fromAss ? x.text : x.text.replaceAll('\n', r'\N');
                b.writeln('Dialogue: ${m[0]},${assT(x.start)},${assT(x.end)},${m[1]},${m[2]},${m[3]},${m[4]},${m[5]},${m[6]},$t');
              }
              if (fromAss && d.footer.isNotEmpty) b.writeln(d.footer);
            } else if (to == 'txt') {
              for (final x in subs) {
                b.writeln(plain(x).replaceAll('\n', ' '));
              }
            } else {
              if (to == 'vtt') b.writeln('WEBVTT\n');
              final sep = to == 'vtt' ? '.' : ',';
              for (var i = 0; i < subs.length; i++) {
                final x = subs[i];
                if (to == 'srt') b.writeln(i + 1);
                b.writeln('${srtT(x.start, sep)} --> ${srtT(x.end, sep)}');
                b.writeln(plain(x));
                b.writeln();
              }
            }
            return b.toString();
          }

          // ---------- ASS styles, proofreading rules, timeline painter ----------
          const List<Color> kPal = [Colors.white, Colors.yellow, Colors.cyanAccent, Colors.lightGreenAccent, Colors.pinkAccent, Colors.orangeAccent, Colors.redAccent, Colors.black];

          String assCol(Color c) => '&H00${c.blue.toRadixString(16).padLeft(2, '0')}${c.green.toRadixString(16).padLeft(2, '0')}${c.red.toRadixString(16).padLeft(2, '0')}'.toUpperCase();

          int _styleFmt(List<String> ls) => ls.indexWhere((l) => l.startsWith('Format:') && l.contains('Fontname'));

          List<String> styleKeys(Doc d) {
            final ls = d.header.split('\n');
            final i = _styleFmt(ls);
            return i < 0 ? <String>[] : ls[i].substring(7).split(',').map((e) => e.trim()).toList();
          }

          List<String> styleNames(Doc d) {
            final n = styleKeys(d).indexOf('Name');
            if (n < 0) return [];
            return [for (final l in d.header.split('\n')) if (l.startsWith('Style:')) l.substring(6).split(',')[n].trim()];
          }

          Map<String, String> getStyle(Doc d, String name) {
            final k = styleKeys(d), n = k.indexOf('Name');
            for (final l in d.header.split('\n')) {
              if (!l.startsWith('Style:')) continue;
              final v = l.substring(6).trim().split(',');
              if (v.length >= k.length && v[n].trim() == name) return {for (var i = 0; i < k.length; i++) k[i]: v[i].trim()};
            }
            return {};
          }

          void setStyle(Doc d, String name, Map<String, String> m) {
            final k = styleKeys(d), n = k.indexOf('Name');
            final ls = d.header.split('\n');
            for (var i = 0; i < ls.length; i++) {
              if (!ls[i].startsWith('Style:')) continue;
              final v = ls[i].substring(6).trim().split(',');
              if (v.length >= k.length && v[n].trim() == name) ls[i] = 'Style: ${k.map((e) => m[e] ?? '').join(',')}';
            }
            d.header = ls.join('\n');
          }

          const kFem = <String, String>{
            'jaata': 'jaati', 'raha': 'rahi', 'gaya': 'gayi', 'karta': 'karti', 'khata': 'khati', 'aaya': 'aayi', 'tha': 'thi',
            'hua': 'hui', 'chahta': 'chahti', 'sakta': 'sakti', 'deta': 'deti', 'leta': 'leti', 'bolta': 'bolti',
            'जाता': 'जाती', 'रहा': 'रही', 'गया': 'गई', 'करता': 'करती', 'था': 'थी', 'हुआ': 'हुई', 'सकता': 'सकती',
            'चाहता': 'चाहती', 'आया': 'आई', 'देता': 'देती', 'लेता': 'लेती', 'बोलता': 'बोलती', 'खाता': 'खाती',
          };

          String? genderFix(String text, bool fem) {
            final map = fem ? kFem : {for (final e in kFem.entries) e.value: e.key};
            var changed = false;
            final out = text.replaceAllMapped(RegExp(r'[\p{L}\p{M}]+', unicode: true), (m) {
              final w = m.group(0)!;
              final r = map[w.toLowerCase()];
              if (r == null) return w;
              changed = true;
              final up = w[0] != w[0].toLowerCase();
              return up ? r[0].toUpperCase() + r.substring(1) : r;
            });
            return changed ? out : null;
          }

          Map<String, dynamic>? charOf(List<Map<String, dynamic>> chars, String who) {
            final w = who.trim().toLowerCase();
            if (w.isEmpty) return null;
            for (final c in chars) {
              final names = [c['n'] as String, ...(c['a'] as String).split(',')].map((e) => e.trim().toLowerCase());
              if (names.contains(w)) return c;
            }
            return null;
          }

          List<Map<String, dynamic>> runChecks(Doc d, List<Map<String, dynamic>> chars) {
            final q = <Map<String, dynamic>>[];
            void add(Sub s, String? neu, String why) => q.add({'id': s.id, 'old': s.text, 'neu': neu, 'why': why});
            final fp = RegExp(r'(?:\bmain\b|\bmai\b|\bmujhe\b|\bhoon\b|\bhun\b|मैं|हूँ|हूं|मुझे)', caseSensitive: false);
            for (var i = 0; i < d.subs.length; i++) {
              final s = d.subs[i], t = s.text, plain = stripTags(t).trim();
              var f = t.replaceAll(RegExp(r' {2,}'), ' ').replaceAllMapped(RegExp(r' +([,.!?])'), (m) => m.group(1)!);
              f = f.replaceAllMapped(RegExp(r'\b(\w+) \1\b', caseSensitive: false), (m) => m.group(1)!);
              if (f != t) add(s, f, 'Spacing / repeated word');
              if (plain.contains('Ã') || plain.contains('â€') || plain.contains('\uFFFD')) add(s, null, 'Possible encoding damage');
              if (i > 0 && plain.isNotEmpty && plain == stripTags(d.subs[i - 1].text).trim()) add(s, null, 'Same text as previous line');
              if (i > 0 && s.start - d.subs[i - 1].end > 8000) add(s, null, 'Gap of ${((s.start - d.subs[i - 1].end) / 1000).toStringAsFixed(1)}s before this line - missing dialogue?');
              if (plain.length > 12 && i + 1 < d.subs.length && RegExp(r'[\p{L}\p{N}]$', unicode: true).hasMatch(plain) && RegExp(r'^\p{Lu}', unicode: true).hasMatch(stripTags(d.subs[i + 1].text).trim())) add(s, '$t.', 'Missing end punctuation');
              for (final c in chars) {
                for (final a in (c['a'] as String).split(',')) {
                  final w = a.trim();
                  if (w.isEmpty) continue;
                  final re = RegExp('\\b${RegExp.escape(w)}\\b');
                  if (re.hasMatch(t)) add(s, t.replaceAll(re, c['n'] as String), 'Name spelling: "$w" -> "${c['n']}"');
                }
              }
              final c = charOf(chars, s.meta.length == 7 ? s.meta[2] : '');
              if (c != null && (c['g'] == 'f' || c['g'] == 'm') && fp.hasMatch(t)) {
                final g = genderFix(t, c['g'] == 'f');
                if (g != null) add(s, g, 'Gender agreement for ${c['n']}');
              }
            }
            return q;
          }

          class TlPainter extends CustomPainter {
            final List<int> wave;
            final int peak, pos, win, sel;
            final List<Sub> subs;
            final List<Sub>? ref;
            TlPainter(this.wave, this.peak, this.subs, this.ref, this.pos, this.win, this.sel);

            @override
            void paint(Canvas c, Size s) {
              final left = pos - win ~/ 2;
              final k = s.width / win;
              final mid = (s.height - 30) / 2;
              final wp = Paint()
                ..color = kBlue.withOpacity(.5)
                ..strokeWidth = max(1.0, 50 * k - 0.5);
              final b0 = max(0, left ~/ 50), b1 = min(wave.length, (left + win) ~/ 50 + 1);
              for (var b = b0; b < b1; b++) {
                final x = (b * 50 - left) * k;
                final h = max(1.0, wave[b] / peak * mid);
                c.drawLine(Offset(x, mid - h), Offset(x, mid + h), wp);
              }
              final tp = Paint()
                ..color = Colors.white24
                ..strokeWidth = 1;
              for (var t = (left ~/ 1000 + 1) * 1000; t < left + win; t += 1000) {
                final x = (t - left) * k;
                c.drawLine(Offset(x, 0), Offset(x, 5), tp);
              }
              if (ref != null) {
                for (final u in ref!) {
                  if (u.end < left || u.start > left + win) continue;
                  c.drawRect(Rect.fromLTRB((u.start - left) * k, 8, max((u.end - left) * k, (u.start - left) * k + 2), 20), Paint()..color = Colors.amberAccent.withOpacity(.5));
                }
              }
              for (var i = 0; i < subs.length; i++) {
                final u = subs[i];
                if (u.end < left || u.start > left + win) continue;
                final r = Rect.fromLTRB((u.start - left) * k, s.height - 28, max((u.end - left) * k, (u.start - left) * k + 2), s.height - 2);
                final isSel = i == sel;
                final rr = RRect.fromRectAndRadius(r, const Radius.circular(5));
                c.drawRRect(rr, Paint()..color = (isSel ? kBlue : kPurple).withOpacity(isSel ? .85 : .6));
                if (isSel) {
                  c.drawRRect(
                      rr,
                      Paint()
                        ..style = PaintingStyle.stroke
                        ..strokeWidth = 2
                        ..color = Colors.white);
                }
                if (r.width > 36) {
                  final tx = TextPainter(
                    text: TextSpan(text: stripTags(u.text).replaceAll('\n', ' '), style: const TextStyle(fontSize: 10, color: Colors.white)),
                    maxLines: 1,
                    ellipsis: '...',
                    textDirection: TextDirection.ltr,
                  )..layout(maxWidth: r.width - 6);
                  tx.paint(c, Offset(r.left + 3, r.top + 6));
                }
              }
              c.drawLine(Offset(s.width / 2, 0), Offset(s.width / 2, s.height), Paint()
                ..color = Colors.white
                ..strokeWidth = 1.5);
            }

            @override
            bool shouldRepaint(covariant CustomPainter o) => true;
          }

          const kAiModels = <String, String>{'gemini': 'gemini-2.5-flash', 'groq': 'llama-3.3-70b-versatile', 'openrouter': 'meta-llama/llama-3.3-70b-instruct:free', 'custom': ''};

          // ---------- editor ----------
          class Editor extends StatefulWidget {
            const Editor({super.key});
            @override
            State<Editor> createState() => _EditorState();
          }

          class _EditorState extends State<Editor> {
            final player = Player();
            late final vc = VideoController(player);
            final scroll = ScrollController();
            final tc = TextEditingController();
            final tf = FocusNode();
            Doc doc = Doc();
            List<Map<String, dynamic>> commits = [];
            Map<int, Sub> base = {};
            final List<String> undo = [], redo = [];
            String? videoPath, subName;
            int sel = -1, active = -1, preRoll = 2000;
            Duration pos = Duration.zero, dur = Duration.zero;
            bool playing = false, loop = false, autoPlay = true, follow = true, needSnap = false;
            double rate = 1.0;
            Timer? _t, _rt;
            bool waveBusy = false, suggBusy = false;
            int ovMode = 2;
            List<String> sugg = [];
            List<int> wave = [];
            int wavePeak = 1, win = 15000, dragMode = 0;
            double tlW = 300;
            Doc? ref;
            String? refName;
            String branch = 'main';
            Map<String, Map<String, dynamic>> others = {};
            List<Map<String, dynamic>> chars = [], queue = [];
            final wch = const MethodChannel('wave');

            bool get ok => sel >= 0 && sel < doc.subs.length;

            @override
            void initState() {
              super.initState();
              tf.addListener(() {
                if (tf.hasFocus) needSnap = true;
              });
              player.stream.position.listen(onPos);
              player.stream.duration.listen((d) {
                if (mounted) setState(() => dur = d);
              });
              player.stream.playing.listen((v) {
                if (mounted) setState(() => playing = v);
              });
              restore();
            }

            @override
            void dispose() {
              _t?.cancel();
              player.dispose();
              super.dispose();
            }

            // ----- playback -----
            int activeAt(int ms) {
              for (var i = 0; i < doc.subs.length; i++) {
                if (ms >= doc.subs[i].start && ms < doc.subs[i].end) return i;
              }
              return -1;
            }

            void onPos(Duration p) {
              pos = p;
              final ms = p.inMilliseconds;
              if (loop && ok && ms >= doc.subs[sel].end) seekMs(doc.subs[sel].start - preRoll);
              final a = activeAt(ms);
              if (a != active) {
                active = a;
                if (playing && follow && a >= 0) scrollTo(a);
              }
              if (mounted) setState(() {});
            }

            void seekMs(int ms) => player.seek(Duration(milliseconds: max(0, ms)));

            void scrollTo(int i) {
              if (!scroll.hasClients) return;
              final t = (i * ext - ext).clamp(0.0, scroll.position.maxScrollExtent).toDouble();
              scroll.animateTo(t, duration: const Duration(milliseconds: 250), curve: Curves.easeOut);
            }

            void select(int i) {
              sel = i;
              tc.text = doc.subs[i].text;
              sugg = [];
              seekMs(doc.subs[i].start - preRoll);
              if (autoPlay) {
                player.play();
              } else {
                player.pause();
              }
              setState(() {});
            }

            // ----- storage -----
            Future<File> pf(String n) async => File('${(await getApplicationDocumentsDirectory()).path}/$n');

            void autosave() {
              _t?.cancel();
              _t = Timer(const Duration(seconds: 2), saveNow);
            }

            Future<void> saveNow() async {
              try {
                final f = await pf('project.json');
                if (await f.exists()) await f.copy((await pf('project.bak.json')).path);
                await f.writeAsString(jsonEncode({
                  'name': subName,
                  'fmt': doc.fmt,
                  'header': doc.header,
                  'footer': doc.footer,
                  'next': doc.nextId,
                  'video': videoPath,
                  'pre': preRoll,
                  'subs': doc.subs.map((e) => e.toJson()).toList(),
                  'commits': commits,
                  'branch': branch,
                  'others': others,
                  'chars': chars,
                  'ref': ref?.subs.map((e) => e.toJson()).toList(),
                  'refName': refName,
                }));
              } catch (_) {}
            }

            Future<void> restore() async {
              try {
                final f = await pf('project.json');
                if (!await f.exists()) return;
                final j = jsonDecode(await f.readAsString());
                doc = Doc()
                  ..fmt = j['fmt']
                  ..header = j['header']
                  ..footer = j['footer']
                  ..nextId = j['next']
                  ..subs = (j['subs'] as List).map((e) => Sub.fromJson(e as Map)).toList();
                subName = j['name'];
                preRoll = j['pre'] ?? 2000;
                commits = (j['commits'] as List).map((e) => Map<String, dynamic>.from(e as Map)).toList();
                rebase();
                branch = j['branch'] ?? 'main';
                others = {for (final e in ((j['others'] ?? {}) as Map).entries) e.key as String: Map<String, dynamic>.from(e.value as Map)};
                chars = ((j['chars'] ?? []) as List).map((e) => Map<String, dynamic>.from(e as Map)).toList();
                if (j['ref'] != null) {
                  ref = Doc()..subs = (j['ref'] as List).map((e) => Sub.fromJson(e as Map)).toList();
                  refName = j['refName'];
                }
                final v = j['video'] as String?;
                if (v != null && File(v).existsSync()) {
                  videoPath = v;
                  await player.open(Media(v), play: false);
                  loadWave();
                  reloadSub();
                }
                if (mounted) setState(() {});
              } catch (_) {}
            }

            void rebase() => base = commits.isEmpty ? {} : {for (final s in subsFrom(commits.last['s'] as String)) s.id: s};

            Future<void> openVideo() async {
              final r = await FilePicker.platform.pickFiles(type: FileType.video);
              final p = r?.files.single.path;
              if (p == null) return;
              videoPath = p;
              await player.open(Media(p), play: false);
              loadWave();
              reloadSub();
              if (mounted) setState(() {});
              autosave();
            }

            Future<void> openSub() async {
              final r = await FilePicker.platform.pickFiles(type: FileType.any);
              if (r == null || r.files.single.path == null) return;
              final f = r.files.single;
              final raw = utf8.decode(await File(f.path!).readAsBytes(), allowMalformed: true);
              final bk = await pf('backup_${DateTime.now().millisecondsSinceEpoch}_${f.name}');
              await bk.writeAsString(raw);
              undo.clear();
              redo.clear();
              commits = [];
              base = {};
              doc = parseDoc(raw, f.name.split('.').last.toLowerCase());
              subName = f.name;
              branch = 'main';
              others = {};
              queue = [];
              reloadSub();
              sel = -1;
              tc.text = '';
              setState(() {});
              saveNow();
            }

            Future<void> exportAs(String to) async {
              if (doc.subs.isEmpty) return;
              await saveNow();
              final out = exportDoc(doc, to);
              final b0 = (subName ?? 'subtitles').replaceAll(RegExp(r'\.[^.]*$'), '');
              final bk = await pf('backup_${DateTime.now().millisecondsSinceEpoch}_$b0.$to');
              await bk.writeAsString(out);
              await FilePicker.platform.saveFile(dialogTitle: 'Save subtitle', fileName: '$b0.$to', bytes: Uint8List.fromList(utf8.encode(out)));
              if (mounted) snack('Exported $b0.$to');
            }

            void snack(String m) => ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));

            // ----- editing -----
            String snap() => jsonEncode(doc.subs.map((e) => e.toJson()).toList());
            void pushUndo() {
              undo.add(snap());
              if (undo.length > 100) undo.removeAt(0);
              redo.clear();
            }

            void mutate(void Function() f) {
              pushUndo();
              f();
              reloadSub();
              setState(() {});
              autosave();
            }

            void fix() {
              if (sel >= doc.subs.length) sel = doc.subs.length - 1;
              tc.text = ok ? doc.subs[sel].text : '';
              reloadSub();
              setState(() {});
              autosave();
            }

            void undoIt() {
              if (undo.isEmpty) return;
              redo.add(snap());
              doc.subs = subsFrom(undo.removeLast());
              fix();
            }

            void redoIt() {
              if (redo.isEmpty) return;
              undo.add(snap());
              doc.subs = subsFrom(redo.removeLast());
              fix();
            }

            void nudge(bool st, int d) {
              if (!ok) return;
              final s = doc.subs[sel];
              mutate(() {
                if (st) {
                  s.start = max(0, s.start + d);
                } else {
                  s.end = max(0, s.end + d);
                }
              });
            }

            void setNow(bool st) {
              if (!ok) return;
              final s = doc.subs[sel];
              mutate(() {
                if (st) {
                  s.start = pos.inMilliseconds;
                } else {
                  s.end = pos.inMilliseconds;
                }
              });
            }

            void split() {
              if (!ok) return;
              final s = doc.subs[sel];
              var cut = tc.selection.baseOffset;
              if (cut <= 0 || cut >= s.text.length) cut = s.text.length ~/ 2;
              var t = pos.inMilliseconds;
              if (t <= s.start + 100 || t >= s.end - 100) t = (s.start + s.end) ~/ 2;
              mutate(() {
                final a = s.text.substring(0, cut).trim(), b = s.text.substring(cut).trim();
                final n = Sub(doc.nextId++, t, s.end, b, List.of(s.meta));
                s.text = a;
                s.end = t;
                doc.subs.insert(sel + 1, n);
              });
              tc.text = s.text;
            }

            void mergeNext() {
              if (!ok || sel + 1 >= doc.subs.length) return;
              final s = doc.subs[sel], n = doc.subs[sel + 1];
              final sep = doc.fmt == 'ass' ? r'\N' : '\n';
              mutate(() {
                s.end = n.end;
                s.text = '${s.text}$sep${n.text}';
                doc.subs.removeAt(sel + 1);
              });
              tc.text = s.text;
            }

            void dup() {
              if (!ok) return;
              final c = doc.subs[sel].copy();
              c.id = doc.nextId++;
              mutate(() => doc.subs.insert(sel + 1, c));
            }

            void del() {
              if (!ok) return;
              mutate(() => doc.subs.removeAt(sel));
              fix();
            }

            void addNow() {
              final t = pos.inMilliseconds;
              var at = doc.subs.indexWhere((x) => x.start > t);
              if (at < 0) at = doc.subs.length;
              final meta = doc.subs.isEmpty ? <String>[] : List<String>.of(doc.subs[at > 0 ? at - 1 : 0].meta);
              mutate(() => doc.subs.insert(at, Sub(doc.nextId++, t, t + 2000, 'New line', meta)));
              sel = at;
              tc.text = 'New line';
              setState(() {});
            }

            // ----- GitHub-style history -----
            void checkpoint(String m) {
              commits.add({'m': m, 't': DateTime.now().millisecondsSinceEpoch, 's': snap()});
              rebase();
            }

            Future<void> commit() async {
              final c = TextEditingController();
              final go = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Commit changes'),
                  content: TextField(controller: c, decoration: const InputDecoration(hintText: 'What did you change?')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Cancel')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('Commit')),
                  ],
                ),
              );
              if (go != true) return;
              checkpoint(c.text.trim().isEmpty ? 'Checkpoint' : c.text.trim());
              setState(() {});
              saveNow();
              if (mounted) snack('Committed');
            }

            List<Widget> diffWidgets(List<Sub> old, List<Sub> cur) {
              Widget row(String t, Color c) => Padding(padding: const EdgeInsets.symmetric(vertical: 3), child: Text(t, style: TextStyle(color: c, fontSize: 13)));
              final om = {for (final s in old) s.id: s}, cm = {for (final s in cur) s.id: s};
              final out = <Widget>[];
              for (final s in cur) {
                final o = om[s.id];
                if (o == null) {
                  out.add(row('+ ${s.text}', Colors.greenAccent));
                } else if (o.text != s.text || o.start != s.start || o.end != s.end) {
                  out.add(row('~ ${o.text}  ->  ${s.text}', Colors.amberAccent));
                }
              }
              for (final o in old) {
                if (!cm.containsKey(o.id)) out.add(row('- ${o.text}', Colors.redAccent));
              }
              if (out.isEmpty) out.add(const Text('No changes'));
              return out;
            }

            void showDiff(Map<String, dynamic> c) {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text('Changes since "${c['m']}"'),
                  content: SizedBox(width: double.maxFinite, height: 320, child: ListView(children: diffWidgets(subsFrom(c['s'] as String), doc.subs))),
                  actions: [TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Close'))],
                ),
              );
            }

            void history() {
              showModalBottomSheet(
                context: context,
                backgroundColor: kCard,
                isScrollControlled: true,
                builder: (ctx) => SafeArea(
