            Future<String> aiCall(String prompt) async {
              final c = await readAi();
              final key = c['key'] ?? '';
              if (key.isEmpty) throw 'Add your free AI key first (menu > AI settings)';
              final prov = c['prov'] ?? 'gemini';
              final model = (c['model'] ?? '').isEmpty ? (kAiModels[prov] ?? '') : c['model']!;
              final Uri uri;
              final Map<String, dynamic> body;
              final head = <String, String>{'content-type': 'application/json'};
              if (prov == 'gemini') {
                uri = Uri.parse('https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$key');
                body = {'contents': [{'parts': [{'text': prompt}]}]};
              } else {
                final base = prov == 'groq' ? 'https://api.groq.com/openai/v1' : (prov == 'openrouter' ? 'https://openrouter.ai/api/v1' : (c['url'] ?? '').replaceAll(RegExp(r'/+$'), ''));
                uri = Uri.parse('$base/chat/completions');
                head['authorization'] = 'Bearer $key';
                body = {'model': model, 'messages': [{'role': 'user', 'content': prompt}], 'temperature': 0.4};
              }
              final cl = HttpClient()..connectionTimeout = const Duration(seconds: 20);
              final rq = await cl.postUrl(uri);
              for (final e in head.entries) {
                rq.headers.set(e.key, e.value);
              }
              rq.add(utf8.encode(jsonEncode(body)));
              final rs = await rq.close();
              final txt = await rs.transform(utf8.decoder).join();
              if (rs.statusCode != 200) throw 'AI error ${rs.statusCode}: ${txt.length > 160 ? txt.substring(0, 160) : txt}';
              final j = jsonDecode(txt);
              return prov == 'gemini' ? j['candidates'][0]['content']['parts'][0]['text'] as String : j['choices'][0]['message']['content'] as String;
            }

            Future<void> suggestLine() async {
              if (!ok || suggBusy) return;
              final u = doc.subs[sel];
              final prev = sel > 0 ? stripTags(doc.subs[sel - 1].text) : '';
              final next = sel + 1 < doc.subs.length ? stripTags(doc.subs[sel + 1].text) : '';
              final who = u.meta.length == 7 ? u.meta[2] : '';
              final ch = charOf(chars, who);
              final c = await readAi();
              final style = (c['style'] ?? '').isEmpty ? 'Hinglish (Hindi written in English letters)' : c['style']!;
              final src = u.orig.isEmpty ? u.text : u.orig;
              final gtxt = ch == null ? '' : '(gender: ${ch['g']})';
              final prompt = 'You help translate subtitles. Rewrite the subtitle line as $style. Keep it short enough to read on screen, keep the meaning and tone, fix grammar, and use correct Hindi gender for the speaker. No explanations.\nOriginal line: ${stripTags(src)}\nCurrent draft: ${stripTags(u.text)}\nPrevious line: $prev\nNext line: $next\nSpeaker: $who $gtxt\nReply ONLY with a JSON array of 3 different suggestions.';
              setState(() {
                suggBusy = true;
                sugg = [];
              });
              try {
                final t = await aiCall(prompt);
                final arr = jsonDecode(t.substring(t.indexOf('['), t.lastIndexOf(']') + 1)) as List;
                sugg = arr.map((e) => e.toString()).where((e) => e.trim().isNotEmpty).take(3).toList();
                if (sugg.isEmpty && mounted) snack('No suggestion');
              } catch (e) {
                if (mounted) snack('$e');
              }
              if (mounted) setState(() => suggBusy = false);
            }

            void applySugg(String t) {
              if (!ok) return;
              final u = doc.subs[sel];
              final m = RegExp(r'^(\{[^}]*\})+').firstMatch(u.text);
              final nt = (m?.group(0) ?? '') + (doc.fmt == 'ass' ? t.replaceAll('\n', r'\N') : t);
              mutate(() => u.text = nt);
              tc.text = nt;
              setState(() => sugg = []);
            }

