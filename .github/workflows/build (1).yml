                                      Navigator.pop(ctx);
                                      mutate(() => doc.subs = subsFrom(c['s'] as String));
                                      fix();
                                    },
                                    child: const Text('Restore'),
                                  ),
                                ]),
                              ),
                          ]),
                  ),
                ),
              );
            }

            // ----- bulk tools -----
            Future<void> shiftAll() async {
              final c = TextEditingController(text: '0.0');
              final go = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Shift all timings'),
                  content: TextField(controller: c, keyboardType: const TextInputType.numberWithOptions(decimal: true, signed: true), decoration: const InputDecoration(labelText: 'Seconds (e.g. -1.5 or 2)')),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Cancel')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('Shift')),
                  ],
                ),
              );
              final d = ((double.tryParse(c.text) ?? 0) * 1000).round();
              if (go != true || d == 0) return;
              checkpoint('Auto checkpoint before shift ${c.text}s');
              mutate(() {
                for (final s in doc.subs) {
                  s.start = max(0, s.start + d);
                  s.end = max(0, s.end + d);
                }
              });
            }

            Future<void> findReplace() async {
              final a = TextEditingController(), b = TextEditingController();
              final go = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Find & replace'),
                  content: Column(mainAxisSize: MainAxisSize.min, children: [
                    TextField(controller: a, decoration: const InputDecoration(labelText: 'Find')),
                    TextField(controller: b, decoration: const InputDecoration(labelText: 'Replace with')),
                  ]),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Cancel')),
                    FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('Replace all')),
                  ],
                ),
              );
              if (go != true || a.text.isEmpty) return;
              var n = 0;
              for (final s in doc.subs) {
                if (s.text.contains(a.text)) n++;
              }
              if (n == 0) {
                if (mounted) snack('Nothing found');
                return;
              }
              checkpoint('Auto checkpoint before replace "${a.text}"');
              mutate(() {
                for (final s in doc.subs) {
                  s.text = s.text.replaceAll(a.text, b.text);
                }
              });
              fix();
              if (mounted) snack('Replaced in $n lines');
            }

            void health() {
              int ov = 0, em = 0, fast = 0, sh = 0, lg = 0, wide = 0;
              for (var i = 0; i < doc.subs.length; i++) {
                final s = doc.subs[i];
                final t = stripTags(s.text);
                final d = (s.end - s.start) / 1000;
                if (i + 1 < doc.subs.length && s.end > doc.subs[i + 1].start) ov++;
                if (t.trim().isEmpty) em++;
                if (d > 0 && t.replaceAll('\n', '').length / d > 20) fast++;
                if (d < 0.5) sh++;
                if (d > 7) lg++;
                if (t.split('\n').any((l) => l.length > 42)) wide++;
              }
              final n = doc.subs.length;
              final score = n == 0 ? 0 : (100 - (ov + em + fast + sh + lg + wide) * 100 ~/ n).clamp(0, 100);
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text('Project health: $score%'),
                  content: Text('Lines: $n\nOverlapping: $ov\nEmpty: $em\nToo fast (>20 cps): $fast\nToo short (<0.5s): $sh\nToo long (>7s): $lg\nLine >42 chars: $wide\nCommits: ${commits.length}'),
                  actions: [TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Close'))],
                ),
              );
            }

